---
- name: Install Zabbix Server
  hosts: monitoring
  become: yes
  tasks:
    - name: Install PostgreSQL
      apt:
        name: postgresql
        state: present
        update_cache: yes

    - name: Install Zabbix repository
      shell: |
        wget -q https://repo.zabbix.com/zabbix/6.0/ubuntu/pool/main/z/zabbix-release/zabbix-release_6.0-4+ubuntu22.04_all.deb
        dpkg -i zabbix-release_6.0-4+ubuntu22.04_all.deb
        apt update

    - name: Install Zabbix Server packages
      apt:
        name:
          - zabbix-server-pgsql
          - zabbix-frontend-php
          - php8.1-pgsql
          - zabbix-nginx-conf
          - zabbix-sql-scripts
          - zabbix-agent
        state: present

    - name: Start PostgreSQL
      service:
        name: postgresql
        state: started
        enabled: yes

    - name: Create Zabbix DB user
      shell: |
        sudo -u postgres psql -c "CREATE USER zabbix WITH PASSWORD 'zabbix_password';" || true
        sudo -u postgres psql -c "CREATE DATABASE zabbix OWNER zabbix;" || true
        sudo -u postgres psql -c "GRANT ALL PRIVILEGES ON DATABASE zabbix TO zabbix;" || true

    - name: Import Zabbix schema
      shell: |
        sudo -u zabbix zcat /usr/share/zabbix-sql-scripts/postgresql/server.sql.gz | sudo -u zabbix psql zabbix
      args:
        creates: /var/lib/postgresql/imported.flag

    - name: Start Zabbix Server
      service:
        name: zabbix-server
        state: started
        enabled: yes

    - name: Start Zabbix Agent
      service:
        name: zabbix-agent
        state: started
        enabled: yes
